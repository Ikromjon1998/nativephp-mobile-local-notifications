name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        nativephp: ['^3.0', '^4.0']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - NativePHP ${{ matrix.nativephp }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Install dependencies
        run: composer update --with "illuminate/support:${{ matrix.laravel }}" --with "nativephp/mobile:${{ matrix.nativephp }}" --no-interaction --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Check refactoring
        run: vendor/bin/rector process --dry-run

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=256M

      - name: Run tests
        run: vendor/bin/pest --coverage --min=90

  # Pins the nativephp/mobile releases the events contract depends on: the
  # oldest that accept DispatchableFromNative events (3.3.11 and 4.6.1, with
  # every other dependency at its lowest allowed version too) and the newest
  # 3.3.x and 4.8.x, which also sign native events. The job above keeps its
  # check names and covers the PHP and Laravel versions.
  nativephp:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - nativephp: '3.3.11'
            dependencies: lowest
          - nativephp: '3.3.*'
            dependencies: highest
          - nativephp: '4.6.1'
            dependencies: lowest
          - nativephp: '4.8.*'
            dependencies: highest

    name: NativePHP ${{ matrix.nativephp }} - ${{ matrix.dependencies }} dependencies

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --with "nativephp/mobile:${{ matrix.nativephp }}" ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }} --no-interaction --prefer-dist

      - name: Show the installed nativephp/mobile
        run: composer show nativephp/mobile

      - name: Run tests
        run: vendor/bin/pest

  lint-native:
    runs-on: ubuntu-latest
    name: Native Code Lint
    steps:
      - uses: actions/checkout@v4

      - name: Check Kotlin syntax
        run: |
          for f in resources/android/src/*.kt; do
            echo "Checking $f..."
            if ! head -1 "$f" | grep -q "^package"; then
              echo "Warning: $f may have syntax issues"
            fi
          done
          echo "Kotlin files checked"

      - name: Check Swift syntax
        run: |
          for f in resources/ios/Sources/*.swift; do
            echo "Checking $f..."
            if ! head -1 "$f" | grep -qE "^(import|//|enum|class|struct|protocol)"; then
              echo "Warning: $f may have syntax issues"
            fi
          done
          echo "Swift files checked"
